<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex — Aula 15 (PokeAPI + jQuery)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<style>
  body { background-color: #f4f6f8; padding: 2rem 1rem 4rem; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .poke-sprite { width: 48px; height: 48px; image-rendering: pixelated; }
  td, th { vertical-align: middle; }
</style>
</head>
<body>

<div class="wrap">
  <a href="../aula-14/" class="d-inline-block mb-3 text-decoration-none">← Aula 14</a>
  <h1 class="h3 mb-1">Pokédex</h1>
  <p class="text-muted mb-4">
    Primeiros 168 Pokémon consumidos direto da <code>PokeAPI</code> com jQuery,
    10 por página.
  </p>

  <table class="table table-hover bg-white shadow-sm rounded">
    <thead>
      <tr>
        <th>#</th>
        <th>Sprite</th>
        <th>Nome</th>
        <th>Altura</th>
        <th>Peso</th>
      </tr>
    </thead>
    <tbody id="tabela">
      <tr><td colspan="5" class="text-center text-muted py-4" id="status">Carregando...</td></tr>
    </tbody>
  </table>

  <nav class="d-flex justify-content-between align-items-center mt-3">
    <button type="button" id="btnAnterior" class="btn btn-outline-secondary btn-sm" disabled>← Anterior</button>
    <span class="text-muted small" id="paginaAtual">Página 1</span>
    <button type="button" id="btnProximo" class="btn btn-outline-secondary btn-sm">Próximo →</button>
  </nav>
</div>

<script>
const TOTAL = 168;
const TAMANHO_PAGINA = 10;
let offsetAtual = 0;

$(function () {
  carregarPagina(0);
  $("#btnAnterior").on("click", () => carregarPagina(Math.max(0, offsetAtual - TAMANHO_PAGINA)));
  $("#btnProximo").on("click", () => carregarPagina(Math.min(TOTAL - 1, offsetAtual + TAMANHO_PAGINA)));
});

function carregarPagina(offset) {
  offsetAtual = offset;
  $("#tabela").html('<tr><td colspan="5" class="text-center text-muted py-4">Carregando...</td></tr>');
  atualizarControles();

  const limite = Math.min(TAMANHO_PAGINA, TOTAL - offset);

  $.getJSON(`https://pokeapi.co/api/v2/pokemon?limit=${limite}&offset=${offset}`).done((lista) => {
    const promessas = lista.results.map((p) => $.getJSON(p.url));

    $.when.apply($, promessas).done(function () {
      const respostas = promessas.length === 1 ? [arguments] : Array.from(arguments);
      const pokemons = respostas.map((r) => r[0]).sort((a, b) => a.id - b.id);
      renderizarTabela(pokemons);
    });
  }).fail(() => {
    $("#tabela").html('<tr><td colspan="5" class="text-center text-danger py-4">Erro ao carregar dados da PokeAPI.</td></tr>');
  });
}

function renderizarTabela(pokemons) {
  const linhas = pokemons.map((p) => `
    <tr>
      <td>${p.id}</td>
      <td><img class="poke-sprite" src="${p.sprites.front_default || ""}" alt="${p.name}"></td>
      <td class="text-capitalize">${p.name}</td>
      <td>${(p.height / 10).toFixed(1)} m</td>
      <td>${(p.weight / 10).toFixed(1)} kg</td>
    </tr>
  `).join("");
  $("#tabela").html(linhas);
}

function atualizarControles() {
  const paginaNum = Math.floor(offsetAtual / TAMANHO_PAGINA) + 1;
  const totalPaginas = Math.ceil(TOTAL / TAMANHO_PAGINA);
  $("#paginaAtual").text(`Página ${paginaNum} de ${totalPaginas}`);
  $("#btnAnterior").prop("disabled", offsetAtual === 0);
  $("#btnProximo").prop("disabled", offsetAtual + TAMANHO_PAGINA >= TOTAL);
}
</script>
</body>
</html>
