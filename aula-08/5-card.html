<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 5 - Card de Apresentação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-5">
    <h1 class="mb-4">Card de Apresentação</h1>

    <div class="row g-4">
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card shadow rounded">
          <svg class="card-img-top" viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração de um notebook">
            <rect width="300" height="160" fill="#dbeafe"/>
            <rect x="70" y="50" width="160" height="70" rx="4" fill="#1e3a8a"/>
            <rect x="80" y="60" width="140" height="50" fill="#60a5fa"/>
            <rect x="60" y="120" width="180" height="10" rx="3" fill="#1e3a8a"/>
          </svg>
          <div class="card-body">
            <h2 class="card-title h5">Desenvolvimento Web</h2>
            <p class="card-text">
              Sites e aplicações responsivas construídas com HTML, CSS e
              Bootstrap, prontas para qualquer tamanho de tela.
            </p>
            <a href="#" class="btn btn-primary">Saiba mais</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
