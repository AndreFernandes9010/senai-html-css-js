<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 2 - Customizando Botões</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-5">
    <h1 class="mb-4">Customizando Botões</h1>

    <section class="mb-5">
      <h2 class="h4">Um botão de cada cor padrão</h2>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>
        <button class="btn btn-info">Info</button>
        <button class="btn btn-light">Light</button>
        <button class="btn btn-dark">Dark</button>
      </div>
    </section>

    <section class="mb-5">
      <h2 class="h4">Botão com ícone</h2>
      <button class="btn btn-primary">
        <i class="bi bi-download me-1"></i> Baixar arquivo
      </button>
    </section>

    <section>
      <h2 class="h4">Tamanhos: btn-lg e btn-sm</h2>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <button class="btn btn-primary btn-lg">Grande (btn-lg)</button>
        <button class="btn btn-primary">Padrão</button>
        <button class="btn btn-primary btn-sm">Pequeno (btn-sm)</button>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
