<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 1 - Grid Responsivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-5">
    <h1 class="mb-4">Página Responsiva Simples</h1>
    <p class="text-muted mb-4">
      3 colunas lado a lado em telas médias/grandes; empilhadas em telas
      pequenas. <code>col-12</code> (padrão, mobile) vira <code>col-md-4</code>
      a partir do breakpoint <code>md</code> (≥768px).
    </p>

    <div class="row g-3">
      <div class="col-12 col-md-4">
        <div class="bg-primary text-white p-4 rounded text-center">Coluna 1</div>
      </div>
      <div class="col-12 col-md-4">
        <div class="bg-secondary text-white p-4 rounded text-center">Coluna 2</div>
      </div>
      <div class="col-12 col-md-4">
        <div class="bg-success text-white p-4 rounded text-center">Coluna 3</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
