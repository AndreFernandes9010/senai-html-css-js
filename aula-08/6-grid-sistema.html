<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 6 - Sistema de Grid do Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-5">
    <h1 class="mb-3">Sistema de Grid Responsivo</h1>
    <p class="text-muted mb-4">
      <strong>lg</strong> (≥992px): 3 colunas lado a lado (<code>col-lg-4</code>).
      <strong>md</strong> (≥768px e &lt;992px): bloco 1 e 2 dividem a linha
      (<code>col-md-6</code>), bloco 3 ocupa a linha inteira sozinho
      (<code>col-md-12</code>). <strong>sm</strong> (&lt;768px): todos em
      100% de largura, empilhados.
    </p>

    <div class="row">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="bg-primary text-white p-3 m-2 border shadow rounded">
          Bloco 1
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="bg-secondary text-white p-3 m-2 border shadow rounded">
          Bloco 2
        </div>
      </div>
      <div class="col-12 col-md-12 col-lg-4">
        <div class="bg-success text-white p-3 m-2 border shadow rounded">
          Bloco 3
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
