<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 3 - Navbar Responsiva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- navbar-expand-lg: vira barra horizontal a partir de "lg" (992px);
       abaixo disso, o conteúdo some em um menu recolhível (collapse),
       aberto pelo navbar-toggler. -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#inicio">Minha Empresa</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarConteudo"
              aria-controls="navbarConteudo" aria-expanded="false"
              aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarConteudo">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#inicio">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#servicos">Serviços</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#contato">Contato</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <p class="text-muted">
      Reduza a largura da janela (ou abra em um celular) para ver o menu
      virar um botão "hambúrguer" que expande a lista de links.
    </p>
    <section id="inicio" class="py-4"><h2>Início</h2></section>
    <section id="servicos" class="py-4"><h2>Serviços</h2></section>
    <section id="contato" class="py-4"><h2>Contato</h2></section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
